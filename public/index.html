<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
  <title>The Sip App</title>
  
  <!-- Importa il font Galindo -->
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Galindo&display=swap">
  <!-- Collega il CSS -->
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <div class="container">
    <!-- Sezione Loading -->
    <div id="loading" class="page loading">
      <img id="loading-bg" src="images/dark-bg.png" alt="Dark Background">
    </div>

    <!-- Logo singolo -->
    <img id="logo" src="images/logo.png" alt="The Sip Logo">

    <!-- Menu a tendina per la selezione della fotocamera (inizialmente nascosto) -->
    <select id="camera-select" style="display: none;"></select>

    <!-- Sezione Homepage -->
    <div id="homepage" class="page homepage">
      <!-- Icona fotocamera al centro, da cliccare per attivare la scansione -->
      <img id="camera-icon" src="images/camera.png" alt="Camera Icon" />

      <!-- Contenitore che mostra la fotocamera e l'overlay (inizialmente nascosto) -->
      <div id="camera-container" style="display: none;">
        <!-- Video per l’anteprima della fotocamera -->
        <video id="camera" autoplay playsinline muted></video>
        <img id="camera-icon-2" src="images/camera.png" alt="Camera Icon per il secondo click" style="display: none;" />
        <!-- Overlay per evidenziare l'area di scansione -->
        <div class="scanner-overlay">
          <div class="scanner-box"></div>
        </div>
      </div>

      <!-- Un contenitore per mostrare l’immagine/carta riconosciuta -->
      <img id="card-display" style="display: none;" />

      <!-- Sezione inferiore: bimba1 e bimba2 -->
      <div id="bottom-section">
        <div id="bimba1">
          <img src="images/bimba1.png" alt="Immagine autori" class="bimba">
          <span class="bottom-text">Gli autori</span>
        </div>
        <div id="bimba2">
          <img src="images/bimba2.png" alt="Immagine copyright" class="bimba">
          <span class="bottom-text">Copyright</span>
        </div>
      </div>
      
      <!-- Container per mostrare il risultato dell'inferenza -->
      <div id="result-container" style="margin-top: 20px; text-align: center;"></div>
      
      <!-- Elemento per la GIF di caricamento -->
      <img id="loading-gif" src="https://loading.io/asset/778317" alt="Caricamento" style="display: none; position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); z-index: 15;">
      
      <!-- Banner per il tentativo fallito -->
      <div id="retry-banner" style="display: none; position: absolute; bottom: 10%; left: 50%; transform: translateX(-50%); background: rgba(0,0,0,0.7); color: #fff; padding: 10px 20px; border-radius: 5px; z-index: 16;">
        Errore nel riconoscimento. Riprova.
      </div>
    </div>
  </div>

  <script src="js/script.js"></script>
</body>
</html>
