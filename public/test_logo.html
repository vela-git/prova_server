<!DOCTYPE html>
<html lang="it">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Test Logo Animation</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    
    body {
      width: 100%;
      height: 100vh;
      background: #8dd2f6;
      overflow: hidden;
    }
    
    /* Logo iniziale: centrato */
    #logo {
      position: absolute;
      z-index: 3;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      width: 340px;
      transition: all 1s ease-in-out;
      cursor: pointer;
      border: 2px solid red; /* Debug border */
    }
    
    /* Stato di transizione: in alto centrato */
    #logo.transition {
      top: 40px;
      left: 50%;
      transform: translate(-50%, 0);
      width: 220px;
    }
    
    /* Linee guida per debug */
    .center-line {
      position: absolute;
      top: 0;
      left: 50%;
      width: 2px;
      height: 100%;
      background: green;
      z-index: 1;
    }
    
    .target-area {
      position: absolute;
      top: 40px;
      left: 50%;
      transform: translateX(-50%);
      width: 220px;
      height: 100px;
      border: 2px dashed blue;
      z-index: 2;
    }
  </style>
</head>
<body>
  <!-- Linea guida centrale -->
  <div class="center-line"></div>
  
  <!-- Area target dove dovrebbe andare il logo -->
  <div class="target-area"></div>
  
  <!-- Logo -->
  <img id="logo" src="images/logo.png" alt="Logo Test">
  
  <script>
    document.addEventListener('DOMContentLoaded', () => {
      const logo = document.getElementById('logo');
      
      logo.addEventListener('click', () => {
        console.log('Logo clicked - adding transition class');
        logo.classList.add('transition');
      });
      
      // Reset button (click sul body)
      document.body.addEventListener('dblclick', () => {
        console.log('Reset animation');
        logo.classList.remove('transition');
      });
    });
  </script>
</body>
</html>
